services:
  - type: web
    name: ballup-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: INIT_DATA_MAX_AGE
        value: "86400"
